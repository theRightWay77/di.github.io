<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Мой первый сайт</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      color: #2c3e50;
    }
    
    .card {
      background: white;
      padding: 20px;
      margin: 90px auto;  
      max-width: 500px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Привет, это мой первый сайт!</h1>
    <p>Я учусь верстать на HTML и CSS.</p>
    <button onclick="showAlert()">Нажми меня</button>
  </div>

  <script>
    function showAlert() {
      alert('Поздравляю! Ты только что запустил JavaScript 🎉');
    }
  </script>
</body>
</html>
