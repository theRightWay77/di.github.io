<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FabLab Алания</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #FFFFFF;
      color: #212121;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #D32F2F;
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      max-width: 600px;
      margin: 0 auto 25px;
      line-height: 1.5;
    }

    .highlight {
      color: #D32F2F;
      font-weight: bold;
    }

    .btn-instagram {
      display: inline-block;
      background: #2f6bd3;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 4px;
      font-size: 1.1em;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn-instagram:hover {
      background: #0641a6;
      transform: translateY(-2px);
    }

    .yellow-accent {
      color: #FFC107;
    }
  </style>
</head>
<body>
  <h1>Добро пожаловать в FabLab!</h1>
  <p>Пространство для творчества, обучения и технологий в Северной Осетии.</p>
  <p>Мы объединяем <span class="highlight">студентов</span>, <span class="highlight">школьников</span> и <span class="highlight">энтузиастов</span>.</p>

  <a href="https://t.me/fablab_alania" 
     target="_blank" 
     class="btn-instagram">
    Подписаться в Telegram
  </a>
  <img src="cat.jpg" alt="котик">
